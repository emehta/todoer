name: Something isn't working
description: Todoer did something it shouldn't, or didn't do something it should.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for saying. Please never paste a key here (anything starting `sb_secret_`, `gsk_` or `pk_`): this page is public.
        A security problem goes to the repo's **Security** tab instead, so it stays private until it is fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Todoer did instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a goal
        2. Drag a task onto tomorrow
        3. ...
  - type: input
    id: version
    attributes:
      label: Todoer version
      description: The `version` line in package.json, in the todoer folder.
      placeholder: "1.1.2"
  - type: dropdown
    id: system
    attributes:
      label: Computer
      options:
        - Mac
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 141, Safari 26, ...
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - publik
        - The download line
        - With Git
